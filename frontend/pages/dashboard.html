<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Transport Management System</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/pages/dashboard.css">
</head>
<body class="role-layout">
    <button class="role-menu-toggle" type="button" aria-controls="role-sidebar" aria-expanded="false" aria-label="Open navigation"><span></span><span></span><span></span></button>
    <button class="role-sidebar-backdrop" type="button" aria-label="Dismiss navigation overlay" hidden></button>
    <aside class="role-sidebar" id="role-sidebar">
        <a href="admin-dashboard.html" class="brand"><span>TRANSPORT MANAGEMENT SYSTEM</span></a>
        <p class="role-nav-label" data-profile-role>Account</p>
        <nav class="role-nav" aria-label="Role navigation" data-role-pages></nav>
        <a class="role-profile-link" href="profile.html">Profile</a>
        <button class="role-logout" type="button" data-logout>Log out</button>
    </aside>
    <main class="role-home workspace-main">
        <header class="role-home-header">
            <p class="eyebrow">OPERATIONS</p>
            <h1>Dashboard</h1>
            <p>Current summary of fleet and operations.</p>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <h2>Total Vehicles</h2>
                <p class="stat-value">—</p>
            </div>
            <div class="stat-card">
                <h2>Active Trips</h2>
                <p class="stat-value">—</p>
            </div>
            <div class="stat-card">
                <h2>Pending Bookings</h2>
                <p class="stat-value">—</p>
            </div>
            <div class="stat-card">
                <h2>Unpaid Invoices</h2>
                <p class="stat-value">—</p>
            </div>
        </section>

        <section class="panel workspace-panel">
            <h2>Recent activity</h2>
            <ul id="recent-activity">
                <li class="workspace-empty">Activity will appear here once page behavior is implemented.</li>
            </ul>
        </section>
    </main>

    <script src="../js/role-nav.js"></script>
</body>
</html>
